services:
  db:
    image: postgres:16

    container_name: blinkly-postgres

    environment:
      POSTGRES_DB: blinkly
      POSTGRES_USER: blinkly
      POSTGRES_PASSWORD: admin

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine

    container_name: blinkly-redis

    ports:
      - "6380:6379"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: blinkly-web

    ports:
      - "8000:8000"

    volumes:
      - ..:/app
      - /app/.venv

    env_file:
      - ../.env

    depends_on:
      - db
      - redis

    command: uv run python manage.py runserver 0.0.0.0:8000

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: blinkly-celery-worker

    volumes:
      - ..:/app
      - /app/.venv

    env_file:
      - ../.env

    depends_on:
      - redis
      - db

    command: uv run celery -A config worker -l info
volumes:
  postgres_data:
