services:
  db:
    restart: unless-stopped
    image: postgres:16

    container_name: blinkly-postgres

    environment:
      POSTGRES_DB: blinkly
      POSTGRES_USER: blinkly
      POSTGRES_PASSWORD: admin

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

  redis:
    restart: unless-stopped
    image: redis:7-alpine

    container_name: blinkly-redis

    ports:
      - "6380:6379"

  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: blinkly-web

    env_file:
      - ../.env

    volumes:
      - static_data:/app/staticfiles

    depends_on:
      - db
      - redis

    command: >
      sh -c "
      uv run python manage.py migrate &&
      uv run python manage.py collectstatic --noinput &&
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "

  nginx:
    image: nginx:1.28-alpine

    restart: unless-stopped

    container_name: blinkly-nginx

    depends_on:
      - web

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro

  celery-worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: blinkly-celery-worker

    env_file:
      - ../.env

    depends_on:
      - redis
      - db

    command: uv run celery -A config worker -l info

volumes:
  postgres_data:
  static_data:
